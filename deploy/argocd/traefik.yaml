# Traefik als Ingress-Controller. Der Service vom Typ LoadBalancer erzeugt über den hcloud-CCM einen
# Hetzner Load Balancer (lb11, hel1), der die Nodes über das private Netz erreicht.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.4.1
    helm:
      valuesObject:
        deployment:
          replicas: 2
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
        # Service-Typ ist im Chart standardmäßig LoadBalancer (das Feld "type" lässt das Schema in v42 nicht zu).
        service:
          annotations:
            load-balancer.hetzner.cloud/name: conference-ingress
            load-balancer.hetzner.cloud/location: hel1
            load-balancer.hetzner.cloud/type: lb11
            load-balancer.hetzner.cloud/use-private-ip: "true"
            load-balancer.hetzner.cloud/disable-private-ingress: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
