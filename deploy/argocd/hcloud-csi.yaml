# Hetzner CSI: Persistent Volumes (StorageClass hcloud-volumes, Standard) – u. a. für PostgreSQL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcloud-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.hetzner.cloud
    chart: hcloud-csi
    targetRevision: 2.24.2
    helm:
      valuesObject:
        controller:
          hcloudVolumeDefaultLocation: hel1
        storageClasses:
          - name: hcloud-volumes
            defaultStorageClass: true
            reclaimPolicy: Retain
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
