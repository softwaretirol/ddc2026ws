# ConferenceApp + PostgreSQL (CloudNativePG) im Namespace "conference".
# Der Namespace und das Pull-Secret "ghcr-pull" legt infra/hetzner-talos/bootstrap an.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conference
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/softwaretirol/ddc2026ws.git
    targetRevision: main
    path: deploy/apps/conference
  destination:
    server: https://kubernetes.default.svc
    namespace: conference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
