# Öffentlich unter https://ddc2026.giesswein.dev – Zertifikat von cert-manager.
# Issuer: erst "letsencrypt-staging" prüfen, dann "letsencrypt-prod".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conference-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ddc2026.giesswein.dev
      secretName: conference-app-tls
  rules:
    - host: ddc2026.giesswein.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conference-app
                port:
                  name: http
