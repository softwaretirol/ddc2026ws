# Öffentlich unter https://ddc2026.giesswein.dev – Zertifikat von cert-manager.
# Issuer: letsencrypt-prod (Staging wurde am 23.11.2026 erfolgreich geprüft).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conference-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ddc2026.giesswein.dev
      secretName: conference-app-tls
  rules:
    - host: ddc2026.giesswein.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conference-app
                port:
                  name: http
