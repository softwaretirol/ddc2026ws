# Testet die Solution und veröffentlicht das Container-Image in der GitHub Container Registry.
# - Push auf main:   Tests -> Image bauen -> ghcr.io/<owner>/<repo>:latest und :sha-<kurz>
# - Pull Request:    Tests -> Image nur bauen (kein Push)
name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests (Unit + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build ConferenceApp.slnx -c Release

      - name: Playwright-Browser installieren
        run: pwsh tests/ConferenceApp.E2ETests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      # E2E-Tests starten PostgreSQL per Testcontainers (Docker ist auf ubuntu-latest vorhanden).
      - name: Tests
        run: dotnet test --solution ConferenceApp.slnx -c Release --no-build

      - name: Testergebnisse hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/
          if-no-files-found: ignore

  image:
    name: Container-Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ConferenceApp
            org.opencontainers.image.description=Konferenzverwaltung (Blazor WebAssembly + ASP.NET Core Minimal API)

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
